services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: metrics-api:local
    ports:
      - "8000:8000"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: metrics-agent:local
    env_file:
      - .env
    environment:
      # Nom du service "api" : résolu par le DNS interne de Compose
      METRICS_ENDPOINT: http://api:8000/metrics
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped