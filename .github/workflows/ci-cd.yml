name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimaux pour le GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # ---------- Job 1 : tests + qualité ----------
  test:
    name: Tests et SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code (historique complet pour SonarQube)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests avec couverture
        run: pytest --cov=app --cov-report=xml

      - name: Analyse SonarQube et Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---------- Job 2 : build, scan, push ----------
  build-scan-push:
    name: Build, scan et push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api, agent]

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/metrics-${{ matrix.service }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image (sans la pousser)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Pousser sur Docker Hub (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"