# Identification du projet SonarCloud
sonar.projectKey=Lebonheur2370_system_metrics_agent
sonar.organization=lebonheur2370
sonar.projectName=system_metrics_agent

# Code applicatif analysé (les tests sont exclus des sources)
sonar.sources=app
sonar.exclusions=app/tests/**

# Tests déclarés à part : ils ne comptent pas dans la couverture
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**

# Langage et couverture
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Le scanner attend le résultat de la Quality Gate et échoue si elle n'est pas validée
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300